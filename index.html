<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082c23"><title>Controle Casas</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f5;color:#14221d}.top{background:linear-gradient(145deg,#071f19,#0d4939);color:#fff;padding:26px 16px 40px;border-radius:0 0 28px 28px}.top h1{margin:0 0 5px;font-size:25px}.top p{margin:0;color:#b9d7cc}.wrap{max-width:720px;margin:-22px auto 90px;padding:0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;padding:15px;border-radius:17px;box-shadow:0 5px 20px #0c38220d}.card.main{background:#123d31;color:#fff}.label{font-size:12px;color:#74827c}.main .label{color:#b9d7cc}.value{font-weight:800;font-size:21px;margin-top:5px}.section{margin-top:22px}.section h2{font-size:17px;margin:0 0 10px}.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border-radius:15px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.item small{display:block;color:#7a8782;margin-top:4px}.green{color:#11865f}.red{color:#c34747}.amt{font-weight:800}.pay{border:0;background:#15956e;color:#fff;padding:9px 11px;border-radius:10px;font-weight:700}.paid{background:#e7f3ee;color:#167457;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700}.note{font-size:13px;color:#68766f;margin-top:8px}.empty{background:#fff;padding:20px;border-radius:15px;color:#87928e;text-align:center}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.top{text-align:center}}</style></head><body><header class="top"><h1>Controle Casas</h1><p>Banca, lucros, retiradas e empréstimos</p></header><main class="wrap"><div class="grid"><div class="card main"><div class="label">Banca disponível</div><div class="value" id="banca"></div></div><div class="card"><div class="label">Banca inicial</div><div class="value">R$ 350,00</div></div><div class="card"><div class="label">Lucro das casas</div><div class="value green" id="lucro"></div></div><div class="card"><div class="label">Retiradas pessoais</div><div class="value red" id="retiradas"></div></div><div class="card"><div class="label">Emprestado pendente</div><div class="value red" id="pendente"></div></div><div class="card"><div class="label">Patrimônio total*</div><div class="value" id="patrimonio"></div></div></div><div class="note">* Patrimônio total considera também o dinheiro emprestado que ainda vai voltar.</div><section class="section"><h2>Empréstimos</h2><div id="emprestimos" class="list"></div></section><section class="section"><h2>Retiradas</h2><div id="listaRet" class="list"></div></section><section class="section"><h2>Lucro por dia</h2><div id="dias" class="list"></div></section></main><script>const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const BANCA_INICIAL=350;const LUCROS=[{data:'02/10/2026',valor:200},{data:'03/10/2026',valor:400},{data:'04/10/2026',valor:850},{data:'05/10/2026',valor:162}];const RETIRADAS=[{nome:'Maromba',valor:260},{nome:'Ian',valor:110}];const KEY='controle_emprestimos_v1';let emp=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:1,nome:'Ricardo',valor:150,devolvido:false},{id:2,nome:'Guilherme',valor:32,devolvido:false}];function devolver(id){let e=emp.find(x=>x.id===id);if(!e||e.devolvido)return;if(confirm(e.nome+' devolveu '+money(e.valor)+'?')){e.devolvido=true;e.dataDevolucao=new Date().toLocaleDateString('pt-BR');localStorage.setItem(KEY,JSON.stringify(emp));render()}}function render(){let l=LUCROS.reduce((a,x)=>a+x.valor,0),r=RETIRADAS.reduce((a,x)=>a+x.valor,0),p=emp.filter(x=>!x.devolvido).reduce((a,x)=>a+x.valor,0);lucro.textContent=money(l);retiradas.textContent=money(r);pendente.textContent=money(p);banca.textContent=money(BANCA_INICIAL+l-r-p);patrimonio.textContent=money(BANCA_INICIAL+l-r);emprestimos.innerHTML=emp.map(e=>`<div class="item"><div><b>${e.nome}</b><small>${e.devolvido?'Devolvido em '+e.dataDevolucao:'Emprestado · aguardando devolução'}</small></div><div style="text-align:right"><div class="amt ${e.devolvido?'green':'red'}">${money(e.valor)}</div>${e.devolvido?'<span class="paid">Devolvido</span>':`<button class="pay" onclick="devolver(${e.id})">Marcar devolvido</button>`}</div></div>`).join('');listaRet.innerHTML=RETIRADAS.map(x=>`<div class="item"><div><b>${x.nome}</b><small>Retirada da banca</small></div><span class="amt red">− ${money(x.valor)}</span></div>`).join('');dias.innerHTML=[...LUCROS].reverse().map(x=>`<div class="item"><div><b>${x.data}</b><small>Lucro líquido do dia</small></div><span class="amt green">+ ${money(x.valor)}</span></div>`).join('')}render()</script></body></html>
