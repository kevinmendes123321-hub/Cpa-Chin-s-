<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#082c23" />
<title>Controle Casas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f5;color:#14221d}.top{background:linear-gradient(145deg,#071f19,#0d4939);color:white;padding:28px 18px 42px;border-radius:0 0 28px 28px}.top h1{font-size:25px;margin:0 0 5px}.top p{margin:0;color:#b9d7cc;font-size:14px}.wrap{max-width:720px;margin:-22px auto 90px;padding:0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;padding:16px;border-radius:17px;box-shadow:0 5px 20px #0c38220d}.label{font-size:12px;color:#74827c}.value{font-weight:750;font-size:20px;margin-top:5px}.profit{background:#123d31;color:#fff}.profit .label{color:#b9d7cc}.profit .value{font-size:25px}.section{margin-top:22px}.section h2{font-size:17px;margin:0 0 11px}.btn{border:0;border-radius:14px;background:#15956e;color:white;font-weight:700;font-size:16px;padding:15px;width:100%}.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border-radius:15px;padding:14px;display:flex;justify-content:space-between;align-items:center}.item small{display:block;color:#7a8782;margin-top:4px}.amt{font-weight:750}.saque{color:#11865f}.deposito,.custo{color:#c34747}.empty{text-align:center;color:#87928e;background:#fff;border-radius:15px;padding:25px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.modal.on{display:flex}.sheet{background:white;width:100%;max-width:720px;margin:auto;border-radius:24px 24px 0 0;padding:20px 18px 28px}.sheet h2{margin:0 0 15px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.type{padding:12px 5px;border:1px solid #dce5e1;background:white;border-radius:12px}.type.active{background:#123d31;color:white;border-color:#123d31}input,select{width:100%;padding:14px;border:1px solid #d9e1de;border-radius:12px;font-size:16px;margin-bottom:10px;background:white}.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}.cancel{background:#e8eeeb;color:#34443e}.datehead{font-size:13px;color:#68766f;margin:14px 2px 7px;font-weight:650}.del{border:0;background:none;color:#9caaa4;font-size:18px;padding:6px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3e9e6;padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.bottom button{max-width:690px}.full{grid-column:1/-1}@media(min-width:650px){.top{text-align:center}.grid{grid-template-columns:repeat(3,1fr)}.profit{grid-column:span 1}}
</style>
</head>
<body>
<header class="top"><h1>Controle Casas</h1><p>Seu controle de saques, depósitos e custos</p></header>
<main class="wrap">
 <div class="grid">
  <div class="card profit"><div class="label">Lucro líquido</div><div class="value" id="lucro">R$ 0,00</div></div>
  <div class="card"><div class="label">Total sacado</div><div class="value" id="saques">R$ 0,00</div></div>
  <div class="card"><div class="label">Total depositado</div><div class="value" id="depositos">R$ 0,00</div></div>
  <div class="card"><div class="label">Custos</div><div class="value" id="custos">R$ 0,00</div></div>
  <div class="card"><div class="label">Resultado hoje</div><div class="value" id="hoje">R$ 0,00</div></div>
  <div class="card"><div class="label">Resultado do mês</div><div class="value" id="mes">R$ 0,00</div></div>
 </div>
 <section class="section"><h2>Resumo por casa</h2><div id="casas" class="list"></div></section>
 <section class="section"><h2>Histórico</h2><div id="historico"></div></section>
</main>
<div class="bottom"><button class="btn" onclick="openModal()">＋ Adicionar movimentação</button></div>
<div class="modal" id="modal"><div class="sheet"><h2>Novo lançamento</h2><div class="types"><button class="type active" data-t="saque" onclick="setType(this)">Saque</button><button class="type" data-t="deposito" onclick="setType(this)">Depósito</button><button class="type" data-t="custo" onclick="setType(this)">Custo</button></div><input id="casa" placeholder="Casa / descrição do custo" /><input id="valor" inputmode="decimal" placeholder="Valor (R$)" /><input id="data" type="date" /><input id="obs" placeholder="Observação (opcional)" /><div class="actions"><button class="btn cancel" onclick="closeModal()">Cancelar</button><button class="btn" onclick="save()">Salvar</button></div></div></div>
<script>
const KEY='controle_casas_v1';let type='saque';let rows=JSON.parse(localStorage.getItem(KEY)||'[]');const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const localDate=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR');const calc=r=>r.tipo==='saque'?r.valor:-r.valor;
function openModal(){document.getElementById('data').value=new Date().toISOString().slice(0,10);document.getElementById('modal').classList.add('on')}function closeModal(){document.getElementById('modal').classList.remove('on')}
function setType(el){type=el.dataset.t;document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('casa').placeholder=type==='custo'?'Descrição do custo':'Nome da casa'}
function save(){let nome=document.getElementById('casa').value.trim(),v=parseFloat(document.getElementById('valor').value.replace(',','.')),d=document.getElementById('data').value;if(!nome||!v||v<=0||!d){alert('Preencha nome, valor e data.');return}rows.push({id:Date.now(),tipo:type,nome,valor:v,data:d,obs:document.getElementById('obs').value.trim()});localStorage.setItem(KEY,JSON.stringify(rows));['casa','valor','obs'].forEach(i=>document.getElementById(i).value='');closeModal();render()}
function del(id){if(confirm('Excluir este lançamento?')){rows=rows.filter(r=>r.id!==id);localStorage.setItem(KEY,JSON.stringify(rows));render()}}
function render(){let s=rows.filter(r=>r.tipo==='saque').reduce((a,r)=>a+r.valor,0),d=rows.filter(r=>r.tipo==='deposito').reduce((a,r)=>a+r.valor,0),c=rows.filter(r=>r.tipo==='custo').reduce((a,r)=>a+r.valor,0);saques.textContent=money(s);depositos.textContent=money(d);custos.textContent=money(c);lucro.textContent=money(s-d-c);let now=new Date(),today=now.toISOString().slice(0,10),ym=today.slice(0,7);hoje.textContent=money(rows.filter(r=>r.data===today).reduce((a,r)=>a+calc(r),0));mes.textContent=money(rows.filter(r=>r.data.startsWith(ym)).reduce((a,r)=>a+calc(r),0));let cm={};rows.filter(r=>r.tipo!=='custo').forEach(r=>{cm[r.nome]??={s:0,d:0};cm[r.nome][r.tipo==='saque'?'s':'d']+=r.valor});casas.innerHTML=Object.keys(cm).length?Object.entries(cm).map(([n,x])=>`<div class="item"><div><b>${esc(n)}</b><small>Sacado ${money(x.s)} · Depositado ${money(x.d)}</small></div><span class="amt ${x.s-x.d>=0?'saque':'deposito'}">${money(x.s-x.d)}</span></div>`).join(''):'<div class="empty">Nenhuma casa registrada.</div>';let groups={};[...rows].sort((a,b)=>b.data.localeCompare(a.data)||b.id-a.id).forEach(r=>(groups[r.data]??=[]).push(r));historico.innerHTML=Object.keys(groups).length?Object.entries(groups).map(([date,rs])=>`<div class="datehead">${localDate(date)} · Resultado ${money(rs.reduce((a,r)=>a+calc(r),0))}</div><div class="list">${rs.map(r=>`<div class="item"><div><b>${r.tipo==='saque'?'Saque':r.tipo==='deposito'?'Depósito':'Custo'} · ${esc(r.nome)}</b><small>${r.obs?esc(r.obs):'Sem observação'}</small></div><div><span class="amt ${r.tipo}">${r.tipo==='saque'?'+':'−'} ${money(r.valor)}</span><button class="del" onclick="del(${r.id})">×</button></div></div>`).join('')}</div>`).join(''):'<div class="empty">Nenhum lançamento ainda.<br>Toque em “Adicionar movimentação”.</div>'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();
</script></body></html>
